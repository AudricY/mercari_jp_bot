# Mercari video-game category leaves collected on a schedule.
# IDs are Mercari "ntiers" leaf category ids (see docs/mercari-scrape-intelligence.md).
# Presence here = enabled. Intervals are seconds; omit to disable that job.
#   snapshot_interval_sec: full on-sale sweep (inventory + asking prices)
#   sold_sweep_interval_sec: full sold-index sweep (transaction prices)
#   new_sweep_interval_sec: delta sweep of newest on-sale listings
categories:
  # ── Software ──
  - category_id: 702
    label: Switch ソフト
    platform: Nintendo Switch
    kind: software
    snapshot_interval_sec: 86400
    sold_sweep_interval_sec: 86400
    new_sweep_interval_sec: 3600
