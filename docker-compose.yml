services:
  redis:
    image: redis:7-alpine
    container_name: mercari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrations:
    build: .
    container_name: mercari-migrations
    env_file:
      - .env
    command: ["pnpm", "run", "db:migrate"]
    volumes:
      - ./data:/app/data

  api:
    build: .
    container_name: mercari-api
    env_file:
      - .env
    command: ["pnpm", "--filter", "@mercari-bot/api", "run", "start"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data

  scheduler:
    build: .
    container_name: mercari-scheduler
    env_file:
      - .env
    command: ["pnpm", "--filter", "@mercari-bot/scheduler", "run", "start"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  worker-scrape:
    build: .
    container_name: mercari-worker-scrape
    env_file:
      - .env
    command: ["pnpm", "--filter", "@mercari-bot/worker-scrape", "run", "start"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data

  worker-notify:
    build: .
    container_name: mercari-worker-notify
    env_file:
      - .env
    command: ["pnpm", "--filter", "@mercari-bot/worker-notify", "run", "start"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
