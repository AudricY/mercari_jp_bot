services:
  migrations:
    build: .
    container_name: mercari-migrations
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/mercari.db"
    command: ["pnpm", "run", "db:migrate"]
    volumes:
      - ./data:/app/data

  app:
    build: .
    container_name: mercari-app
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/mercari.db"
    command: ["pnpm", "--filter", "@mercari-bot/unified", "run", "start"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
