services:
  migrations:
    image: ghcr.io/audricy/mercari-jp-bot:latest
    container_name: mercari-migrations
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/mercari.db"
    command: ["pnpm", "run", "db:migrate"]
    volumes:
      - ./data:/app/data

  app:
    image: ghcr.io/audricy/mercari-jp-bot:latest
    container_name: mercari-app
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/mercari.db"
      CONFIG_PATH: "/app/config.yaml"
    command: ["pnpm", "--filter", "@mercari-bot/unified", "run", "start"]
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro

  analytics:
    image: ghcr.io/audricy/mercari-jp-bot:latest
    container_name: mercari-analytics
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/mercari.db"
      ANALYTICS_API_URL: "http://app:3000"
      PORT: "3001"
    command: ["node", "apps/analytics-web/.next/standalone/apps/analytics-web/server.js"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
