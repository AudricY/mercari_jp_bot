# Mercari JP Bot — keyword configuration
# Presence in this file = enabled. Remove a keyword to disable it.
# Use POST /v1/config/reload to hot-reload without restarting.

keywords:
  # ── Hardware ──
  ps3:
    topic: Hardware
    term:
      - プレイステーション3 (PS3) 本体
      - Playstation 3
      - PS3
    price_min: 4000
    price_max: 22000
    exclude_keyword: CECH
    category_id: 7091
    interval_sec: 30
  ps4:
    topic: Hardware
    term: プレイステーション4 (PS4) 本体
    price_min: 7000
    category_id: 6988
    interval_sec: 30

  switch_handhelds:
    topic: Handhelds
    term:
      - ニンテンドースイッチ 本体
      - Nintendo Switch 有機EL 本体
      - Nintendo Switch OLED 本体
      - ニンテンドースイッチライト 本体
    price_min: 7000
    price_max: 32000
    title_must_contain: 本体
    interval_sec: 30

  psp_handhelds:
    topic: Handhelds
    term:
      - PSP 1000 本体
      - PSP 2000 本体
      - PSP 3000 本体
    price_min: 3000
    price_max: 22000
    title_must_contain: PSP
    interval_sec: 30

  vita_handhelds:
    topic: Handhelds
    term:
      - PS Vita 1000 本体
      - PS Vita 2000 本体
      - PCH-1000 本体
      - PCH-2000 本体
    price_min: 5000
    price_max: 26000
    title_must_contain:
      - Vita
      - PCH
    interval_sec: 30

  nintendo_handhelds:
    topic: Handhelds
    term:
      - ニンテンドー2DS 本体
      - Newニンテンドー2DS LL 本体
      - ニンテンドー3DS 本体
      - ニンテンドー3DS LL 本体
      - Newニンテンドー3DS 本体
      - Newニンテンドー3DS LL 本体
    price_min: 5000
    price_max: 35000
    title_must_contain: 本体
    interval_sec: 30

  # ── Switch Software ──
  # 4 franchise searches cover ~30 games. Tested on Mercari API 2025-03-05.
  # "franchise + Switch" filters out merchandise effectively.
  # API returns max 100 results sorted by newest — broad enough to catch all
  # sub-titles, narrow enough to exclude plushies/cards/accessories.

  pokemon:
    topic: Switch Games
    # Covers: Shield, Sword, Arceus, Let's Go Pikachu/Eevee, Shining Pearl,
    # Brilliant Diamond, Scarlet, Violet, Scarlet+DLC, Violet+DLC
    # Does NOT cover: Newポケモンスナップ (different naming → separate term)
    term:
      - ポケットモンスター Switch
      - Newポケモンスナップ
    price_max: 18000
    category_id: 702
    interval_sec: 60

  mario:
    topic: Switch Games
    # Covers: Odyssey, Wonder, 3D World, 3D Collection, Kart 8, Party,
    # Party Jamboree, NSMBU, Mario & Sonic Olympics, Paper Mario
    # Does NOT cover: スマッシュブラザーズ, ルイージマンション (no "マリオ" in title)
    term: マリオ ソフト Switch
    price_max: 8500
    category_id: 702
    interval_sec: 60

  zelda:
    topic: Switch Games
    # Covers: BotW, TotK, Link's Awakening — all confirmed in test
    term: ゼルダの伝説 Switch
    price_max: 5000
    category_id: 702
    interval_sec: 60

  kirby:
    topic: Switch Games
    # Covers: Discovery, Star Allies, Wii Deluxe — all confirmed
    term: 星のカービィ Switch
    price_max: 4500
    category_id: 702
    interval_sec: 90

  # ── Games not covered by franchise searches ──
  # Each term is a separate API call. Grouped under one keyword for config brevity.

  switch_other:
    topic: Switch Games
    term:
      - 大乱闘スマッシュブラザーズ SPECIAL
      - ルイージマンション3
      - あつまれ どうぶつの森
      - スプラトゥーン3
    price_max: 5500
    category_id: 702
    interval_sec: 90

  switch_niche:
    topic: Switch Games
    term:
      - ピクミン4
      - Xenoblade3
      - ヨッシークラフトワールド
      - スニッパーズ
    price_max: 5000
    category_id: 702
    interval_sec: 120

  switch_niche2:
    topic: Switch Games
    term:
      - It Takes Two
      - 超おどる メイドインワリオ
      - Nintendo Switch Sports
      - デイヴ・ザ・ダイバー
      - 三國無双7 with 猛将伝 DX
      - Minecraft Nintendo Switch版
      - Minecraft Dungeons Ultimate Edition
      - マインクラフト:ストーリーモード シーズン2
    price_max: 6000
    category_id: 702
    interval_sec: 120

  # ── NS2 (Nintendo Switch 2) ──
  ns2:
    topic: NS2
    term:
      - ドンキーコング バナンザ Nintendo Switch 2 Edition
      - ドンキーコング バナンザ Nintendo Switch2
      - HADES II Nintendo Switch 2 Edition
      - サイバーパンク2077 アルティメットエディション Nintendo Switch 2 Edition
      - マリオカートワールド Nintendo Switch 2 Edition
      - ゼルダの伝説 ブレスオブザワイルド Nintendo Switch 2 Edition
      - ゼルダの伝説 ティアーズ オブ ザ キングダム Nintendo Switch 2 Edition
      - 星のカービィディスカバリー Nintendo Switch 2 Edition
      - スーパーマリオパーティ ジャンボリー Nintendo Switch 2 Edition
      - マリオカートワールド
      - ドンキーコング バナンザ
      - HADES II
    price_max: 8500
    category_id: 702
    interval_sec: 90
